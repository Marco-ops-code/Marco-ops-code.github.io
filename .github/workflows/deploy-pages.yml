name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html style.css script.js i18n.js contact.php sitemap.xml robots.txt mentions.html cv.css cv.html cv-salarie.html cv-en.html cv-ru.html cv-marc-onel-volcimus.pdf cv-marc-onel-volcimus-salarie.pdf cv-marc-onel-volcimus-en.pdf cv-marc-onel-volcimus-ru.pdf flyer.css flyer-fr.html flyer-en.html flyer-ru.html flyer-marc-onel-volcimus-fr.pdf flyer-marc-onel-volcimus-en.pdf flyer-marc-onel-volcimus-ru.pdf _site/
          cp -r assets slides _site/
          rm -f _site/assets/logoMarcportfolio.png
          rm -f _site/assets/projects/windows.png _site/assets/projects/mobile.png
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
