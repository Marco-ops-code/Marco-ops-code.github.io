<!DOCTYPE html>
<html lang="fr" class="no-js">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page introuvable — Marc-Onel Volcimus</title>
    <meta name="robots" content="noindex" />
    <meta
      name="description"
      content="Cette adresse n’existe pas sur le site de Marc-Onel Volcimus."
    />
    <link rel="icon" href="/assets/mark-avatar.jpg?v=1" type="image/jpeg" />
    <meta name="theme-color" content="#1d4ed8" />
    <script>
      try {
        document.documentElement.classList.remove("theme-dark");
        const savedLang = localStorage.getItem("portfolio-lang");
        if (savedLang === "en" || savedLang === "es") {
          document.documentElement.lang = savedLang;
        }
      } catch (error) {
        /* storage blocked */
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Quantico:wght@400;700&family=Source+Sans+3:wght@400;600;700&display=swap"
    />
    <link rel="stylesheet" href="/style.css?v=20260813-s157" />
  </head>
  <body data-page="missing">
    <a class="skip-link" href="#main" data-i18n="skip">Aller au contenu</a>
    <div class="background-glow" aria-hidden="true"></div>

    <header class="header" id="siteHeader">
      <div class="container nav">
        <a href="/index.html#home" class="logo">
          <img
            src="/assets/mark-avatar.jpg?v=1"
            alt=""
            class="logo-avatar"
            width="38"
            height="38"
            decoding="async"
          />
          <span class="logo-text">Marc-Onel VOLCIMUS<span>.</span></span>
        </a>
        <nav class="site-nav site-nav--desktop" data-i18n-aria="nav_main" aria-label="Navigation">
          <ul class="nav-links">
            <li><a href="/index.html" data-i18n="nav_back">Retour au site</a></li>
          </ul>
        </nav>
        <div class="nav-toolbar">
          <div class="nav-lang" role="group" data-i18n-aria="nav_lang" aria-label="Langue">
            <button type="button" class="nav-lang__btn is-active" data-lang="fr" lang="fr" aria-pressed="true">FR</button>
            <button type="button" class="nav-lang__btn" data-lang="en" lang="en" aria-pressed="false">EN</button>
            <button type="button" class="nav-lang__btn" data-lang="es" lang="es" aria-pressed="false">ES</button>
          </div>
        </div>
      </div>
    </header>

    <main id="main" tabindex="-1">
      <article class="section container missing-page">
        <p class="missing-page__code">404</p>
        <h1 data-i18n="missing_h1">Cette adresse n’existe pas.</h1>
        <p data-i18n="missing_p">La page a été déplacée, ou le lien est incomplet.</p>
        <div class="missing-page__actions">
          <a class="btn" href="/index.html" data-i18n="missing_home">Retour à l’accueil</a>
          <a class="btn btn-outline" href="/index.html#contact" data-i18n="missing_contact">Contact</a>
        </div>
      </article>
    </main>

    <footer class="footer">
      <div class="container">
        <p>
          © <span id="year"></span> Marc-Onel Volcimus.
          <span data-i18n="rights">Tous droits réservés.</span>
          <span class="footer-sep" aria-hidden="true">·</span>
          <a href="/privacy.html" data-i18n="privacy_link">Politique de confidentialité</a>
        </p>
      </div>
    </footer>
    <script src="/i18n.js?v=20260813-s21" defer></script>
    <script src="/script.js?v=20260813-s72" defer></script>
  </body>
</html>
